services:
  catalogo:
    image: ghcr.io/luanaabrantes/catalogo-filmes-catalogo:${IMAGE_TAG:?Defina IMAGE_TAG como sha-hash completo do commit}

    ports:
      - "8216:3000"

    environment:
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      TMDB_TOKEN: ${TMDB_TOKEN}

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-perfil-fotos}
      AUTH_SERVICE_URL: http://auth-service:3001
      LOG_SERVICE_URL: http://log-service:3002

      PORT: 3000
      NODE_ENV: production

    depends_on:
      - auth-service

    restart: unless-stopped

    networks:
      - catalogo-network

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 20s

  auth-service:
    image: ghcr.io/luanaabrantes/catalogo-filmes-auth-service:${IMAGE_TAG:?Defina IMAGE_TAG como sha-hash completo do commit}

    expose:
      - "3001"

    environment:
      PORT: 3001
      LOG_SERVICE_URL: http://log-service:3002

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

      JWT_SECRET: ${JWT_SECRET}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}

      CATALOGO_URL: https://luana-abrantes-isw055.lapps.studio

    dns:
      - 8.8.8.8
      - 1.1.1.1

    restart: unless-stopped

    networks:
      - catalogo-network

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 20s

  minio:
    image: ghcr.io/luanaabrantes/catalogo-filmes-minio:${IMAGE_TAG:?Defina IMAGE_TAG como sha-hash completo do commit}
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Defina MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Defina MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    expose:
      - '9000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - catalogo-network

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - audit-redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - catalogo-network

  log-service:
    image: ghcr.io/luanaabrantes/catalogo-filmes-log-service:${IMAGE_TAG:?Defina IMAGE_TAG como sha-hash completo do commit}
    environment:
      PORT: 3002
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
    expose:
      - "3002"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - catalogo-network

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 3
      start_period: 20s

networks:
  catalogo-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.88.0.0/24

volumes:
  minio-data:
  audit-redis-data:
