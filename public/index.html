<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Catálogo de Filmes</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="auth-title">

            <h1>
                Catálogo de Filmes
            </h1>

            <p>
                Filmes com Tom Hanks
            </p>

        </div>


        <h2>
            Login
        </h2>


        <form id="formLogin">

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="nome@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-auth"
            >
                Entrar
            </button>

        </form>


        <p id="mensagem"></p>


        <div class="auth-footer">

            <span>
                Não possui uma conta?
            </span>

            <a href="/cadastro.html">
                Criar conta
            </a>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
