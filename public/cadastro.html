<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro | Catálogo de Filmes</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="auth-title">

            <h1>
                Catálogo de Filmes
            </h1>

            <p>
                Filmes com Tom Hanks
            </p>

        </div>


        <h2>
            Criar conta
        </h2>


        <form id="formCadastro">

            <div class="form-group">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Seu nome"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="nome@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Mínimo de 6 caracteres"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-auth"
            >
                Cadastrar
            </button>

        </form>


        <p id="mensagem"></p>


        <div class="auth-footer">

            <span>
                Já possui uma conta?
            </span>

            <a href="/">
                Fazer login
            </a>

        </div>

    </main>


    <script src="cadastro.js"></script>

</body>

</html>
