<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Catálogo de Filmes | Tom Hanks
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body class="catalogo-page">

    <!-- CABEÇALHO -->
    <header>

        <div>

            <h1>
                Catálogo de Filmes
            </h1>

            <p>
                Filmes com Tom Hanks
            </p>

        </div>


        <div>

            <span id="nomeUsuario">
                Usuário
            </span>

            <span id="catalogoAdminBadge" class="catalogo-admin-badge" hidden>Admin</span>
            <a id="catalogoAdminLink" class="catalogo-admin-link" href="/admin.html#overview" hidden>Painel administrativo</a>

            <button
                type="button"
                id="btnLogout"
            >
                Sair
            </button>

        </div>

    </header>


    <!-- CONTEÚDO -->
    <main>

        <p id="mensagemCarregamento">
            Carregando filmes...
        </p>


        <section
            id="listaFilmes"
            class="lista-filmes"
        >
        </section>

    </main>


    <script src="catalogo.js"></script>

</body>

</html>
