<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Recuperar senha | Catálogo de Filmes</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body class="auth-page">

    <main class="auth-card">

        <div class="auth-title">

            <h1>
                Catálogo de Filmes
            </h1>

            <p>
                Filmes com Tom Hanks
            </p>

        </div>


        <h2>
            Recuperar senha
        </h2>


        <p>
            Informe o e-mail da sua conta.
            Você receberá um link para criar uma nova senha.
        </p>


        <form id="formEsqueciSenha">

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="nome@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn-auth"
            >
                Enviar link de recuperação
            </button>

        </form>


        <p id="mensagem"></p>


        <div class="auth-footer">

            <a href="/">
                Voltar para o login
            </a>

        </div>

    </main>


    <script src="esqueci-senha.js"></script>

</body>

</html>
